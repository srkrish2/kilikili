# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen && cd ios && xcodegen
# The .xcodeproj is generated, so it is git-ignored; this file is the source of truth.
name: TamilTrain
options:
  bundleIdPrefix: com.sarathy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  TamilTrainCore:
    path: TamilTrainCore
targets:
  TamilTrain:
    type: application
    platform: iOS
    sources:
      - path: TamilTrain
    dependencies:
      - package: TamilTrainCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sarathy.tamiltrain
        PRODUCT_NAME: TamilTrain
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tamil Train
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Record Amma, Appa or Paatti saying each word so Chinmay hears family voices."
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        # Set your team in Xcode (Signing & Capabilities) or here:
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
schemes:
  TamilTrain:
    build:
      targets:
        TamilTrain: all
    run:
      config: Debug
    test:
      config: Debug
